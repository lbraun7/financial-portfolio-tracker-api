[project]
name = "financial-portfolio-tracker-api"
version = "0.1.0"
description = "REST API for investment portfolio tracking, FIFO cost basis, and P&L calculation."
authors = [{ name = "Lucas Braun", email = "lucasbraun96@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13.3,<2.0.0",
    "asyncpg>=0.29.0,<0.30.0",
    "bcrypt>=4.2.0,<5.0.0",
    "fastapi>=0.115.0,<0.116.0",
    "greenlet>=3.1.1,<4.0.0",
    "httpx>=0.27.2,<0.28.0",
    "psycopg[binary]>=3.2.2,<4.0.0",
    "pydantic>=2.9.2,<3.0.0",
    "pydantic-settings>=2.5.2,<3.0.0",
    "pyjwt>=2.9.0,<3.0.0",
    "redis>=5.1.1,<6.0.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0.0",
    "structlog>=24.4.0,<25.0.0",
    "uvicorn[standard]>=0.30.6,<0.31.0",
]

[project.scripts]
api = "app.main:main"

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
mypy = "^1.11.2"
pre-commit = "^3.8.0"
ruff = "^0.6.8"

[tool.poetry.group.test.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=app.domain",
    "--cov=app.services",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
markers = [
    "integration: tests that require PostgreSQL",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "RUF",
    "S",
    "UP",
    "W",
]
ignore = [
    "S104",
    "S105",
    "S106",
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"app/db/base.py" = ["N805"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
