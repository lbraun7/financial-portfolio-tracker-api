name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio_test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://portfolio:portfolio@127.0.0.1:5433/portfolio_test_db
      REQUIRE_INTEGRATION_DB: "1"
      SECRET_KEY: quality-check-secret-key-at-least-32-bytes

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Ruff
        run: poetry run ruff check app tests

      - name: Ruff format
        run: poetry run ruff format --check app tests

      - name: Mypy
        run: poetry run mypy app tests

      - name: Tests
        run: poetry run pytest
