repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: poetry run ruff check
        language: system
        types: [python]
        pass_filenames: false
        args: [app, tests]

      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format --check
        language: system
        types: [python]
        pass_filenames: false
        args: [app, tests]

      - id: mypy
        name: mypy
        entry: poetry run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [app, tests]

      - id: pytest-unit
        name: pytest unit
        entry: poetry run pytest
        language: system
        types: [python]
        pass_filenames: false
        args: [tests/unit]
